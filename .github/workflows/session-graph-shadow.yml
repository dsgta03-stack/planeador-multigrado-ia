name: SessionGraph Shadow CI

on:
  push:
    branches:
      - session-graph-v1-shadow
      - session-graph-authoring-r2-shadow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SessionGraph tests
        run: node --test shadow/session-graph-v1/tests/*.test.mjs
      - name: Pipeline tests
        run: node --test shadow/pipeline-v1/tests/*.test.mjs
      - name: TeacherPlanProjection presentation tests
        run: node --test shadow/presentation-v1/tests/*.test.mjs
